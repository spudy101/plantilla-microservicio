name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}

      - name: Install dependencies
        # Con lockfile versionado se exige que esté al día (reproducible).
        run: pnpm install ${{ hashFiles('pnpm-lock.yaml') != '' && '--frozen-lockfile' || '--no-frozen-lockfile' }}

      - name: Lint
        run: pnpm lint

      - name: Test
        # Cada paquete corre con SQLite en memoria, bus en memoria y claves efímeras:
        # no hace falta .env ni Postgres/Redis.
        run: pnpm test
        env:
          NODE_ENV: test

  docker:
    name: Build images
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      matrix:
        service: [api-gateway, iam-service, person-service, notification-service, audit-service]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.service }}
        run: docker build -f docker/service.Dockerfile --build-arg SERVICE=${{ matrix.service }} -t ${{ matrix.service }}:ci .
